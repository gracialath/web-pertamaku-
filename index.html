<!DOCTYPE html>
<html>
<head>
<title>Gracia's Little Corner ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
body {
    background: linear-gradient(-45deg, #cde9ff, #eaf6ff, #d4f1ff, #a8d8ff);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2a4d69;
}
@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* bintang jatuh */
.stars {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
}
@keyframes twinkle {
    0%, 100% {opacity: 0;}
    50% {opacity: 1;}
}

.card {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px);
    border-radius: 40px;
    padding: 50px;
    max-width: 550px;
    margin: 20px;
    box-shadow: 0 20px 60px rgba(58, 124, 165, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.4);
    animation: float 4s ease-in-out infinite;
    z-index: 2;
    position: relative;
}
@keyframes float {
    0%, 100% {transform: translateY(0px);}
    50% {transform: translateY(-15px);}
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 55px;
    margin-bottom: 5px;
    color: #3a7ca5;
    text-shadow: 0 0 20px rgba(168, 216, 255, 0.7);
    letter-spacing: 4px;
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
    from {text-shadow: 0 0 10px rgba(168, 216, 255, 0.5);}
    to {text-shadow: 0 0 25px rgba(168, 216, 255, 0.9);}
}

.quote {
    font-size: 16px;
    font-style: italic;
    color: #6aa9d0;
    margin-bottom: 30px;
    letter-spacing: 2px;
}

p {
    font-size: 18px;
    color: #4a7a9a;
    margin-bottom: 25px;
    line-height: 1.8;
    font-weight: 300;
}

img {
    width: 270px;
    border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 30px rgba(168, 216, 255, 0.6);
    transition: all 0.5s;
}
img:hover {
    transform: scale(1.08) rotate(3deg);
    box-shadow: 0 0 40px rgba(168, 216, 255, 0.9);
}

.button {
    display: inline-block;
    background: linear-gradient(90deg, #a8d8ff, #8cc7f0);
    color: #2a4d69;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 1.5px;
    transition: all 0.4s;
    border: none;
    box-shadow: 0 8px 25px rgba(58, 124, 165, 0.3);
}
.button:hover {
    background: linear-gradient(90deg, #8cc7f0, #7ab8e8);
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 35px rgba(58, 124, 165, 0.4);
}
</style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="card">
        <h1>hi, i'm gracia ✧</h1>
        <p class="quote">“living my soft blue era” ༘⋆</p>
        <p>welcome to my first website ⋆˙⟡<br>
        just a girl who loves coding, coffee, and cute things ☕︎<br>
        made with github and a lot of semangat ♡</p>
        <img src="fotoku.jpeg" alt="me">
        <br><br>
        <a href="https://instagram.com/uwho?" target="_blank" class="button">follow me on instagram ♡</a>
        <a href="galeri.html" class="button">see my gallery ♡</a>
    </div>

<script>
// bikin bintang random
const starsContainer = document.getElementById('stars');
for(let i=0; i<30; i++){
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 3 + 'px';
    star.style.height = star.style.width;
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
}
</script>
</body>
</html>
