<!DOCTYPE html>
<html>
<head>
<title>Website Pertamaku 💙</title>
<style>
body {
    background: linear-gradient(135deg, #cde9ff 0%, #eaf6ff 100%);
    color: #2a4d69;
    font-family: 'Poppins', 'Arial', sans-serif;
    text-align: center;
    padding: 80px 20px;
    margin: 0;
}
h1 {
    font-size: 45px;
    margin-bottom: 15px;
    color: #3a7ca5;
    text-shadow: 2px 2px 8px rgba(58, 124, 165, 0.2);
}
p {
    font-size: 20px;
    color: #4a7a9a;
    margin-bottom: 25px;
}
.card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 40px;
    max-width: 500px;
    margin: 0 auto;
    box-shadow: 0 15px 40px rgba(58, 124, 165, 0.2);
    border: 2px solid rgba(205, 233, 255, 0.5);
}
img {
    width: 260px;
    border-radius: 50%;
    margin-top: 10px;
    border: 5px solid #a8d8ff;
    box-shadow: 0 8px 25px rgba(58, 124, 165, 0.3);
    transition: transform 0.3s;
}
img:hover {
    transform: scale(1.05);
}
</style>
</head>
<body>
    <div class="card">
        <h1>Halo! Aku Gracia 💙</h1>
        <p>Selamat datang di website pertamaku ✨<br>Dibuat pake Github + semangat 🥰</p>
        <img src="fotoku.jpeg" alt="foto aku">
    </div>
</body>
</html>
