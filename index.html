<!DOCTYPE html>
<html>
<head>
<title>Website Pertamaku</title>
<style>
body {
    background: linear-gradient(135deg, #cde9ff 0%, #eaf6ff 100%);
    color: #2c3e50;
    font-family: 'Arial', sans-serif;
    text-align: center;
    padding: 80px 20px;
    margin: 0;
}
h1 {
    font-size: 42px;
    margin-bottom: 10px;
    color: #3a7ca5;
}
p {
    font-size: 20px;
    color: #4a7a9a;
}
.card {
    background: #f0f8ff;
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(58, 124, 165, 0.15);
    border: 2px solid #cde9ff;
}
img {
    width: 250px;
    border-radius: 20px;
    margin-top: 15px;
    border: 3px solid #a8d8ff;
}
</style>
</head>
<body>
    <div class="card">
        <h1>Halo! Ini Website Pertamaku 💙</h1>
        <p>Nama aku Gracia. Dibuat pake Github 🥰</p>
        <img src="fotoku.jpeg" alt="foto aku">
    </div>
</body>
</html>
