<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Gallery 🕸️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #a8d8ff, #dbefff, #ff09ff, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.08;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        @keyframes wiggle {
            0% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(-1.5deg); }
        }

        h1 {
            font-size: 2.5em;
            font-weight: 600;
            color: #2a5f8f;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        p.subtitle { 
            color: #555; 
            margin-bottom: 40px; 
            font-weight: 300;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            padding: 18px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .gallery img {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: box-shadow 0.3s ease;
        }

        .gallery img:hover {
            animation: wiggle 0.5s ease;
            box-shadow: 0 0 25px rgba(168, 216, 255, 0.7);
            transform: none !important;
        }

        .card p {
            margin-top: 15px;
            font-weight: 600;
            color: #2a5f8f;
            font-size: 1em;
            letter-spacing: 1px;
        }

        .button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.7);
            color: #2a5f8f;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <h1>My Little Gallery 🕸️</h1>
    <p class="subtitle">Hover to see the magic ✨</p>

    <div class="gallery">
        <div class="card">
            <img src="spidergirl.jpg" alt="Spidergirl 1">
            <p>Midnight Web</p>
        </div>
        <div class="card">
            <img src="spidergirl2.jpg" alt="Spidergirl 2">
            <p>Neon Glow</p>
        </div>
        <div class="card">
            <img src="spidergirl3.jpg" alt="Spidergirl 3">
            <p>Behind The Web</p>
        </div>
        <div class="card">
            <img src="spidergirl4.jpg" alt="Spidergirl 4">
            <p>Rooftop Dreams</p>
        </div>
    </div>

    <a href="index.html" class="button">← Back to Home</a>
</body>
</html>
